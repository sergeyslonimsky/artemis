name: Artemis
options:
  bundleIdPrefix: com.artemis
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.3
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: 2.4.1

targets:
  Artemis:
    type: application
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Artemis
    dependencies:
      - package: GRDB
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_NAME: Artemis
        PRODUCT_BUNDLE_IDENTIFIER: com.artemis.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PLFAQZ6LX2
        INFOPLIST_KEY_CFBundleDisplayName: "Artemis"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to attach to your message."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
