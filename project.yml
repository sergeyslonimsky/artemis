name: Artemis
options:
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.12.0
  Textual:
    url: https://github.com/gonzalezreal/textual.git
    minorVersion: 0.5.0

targets:
  Artemis:
    type: application
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Artemis
      - path: Shared
    scheme:
      testTargets:
        - ArtemisTests
    # Keys without an INFOPLIST_KEY_ build setting; merged into the generated Info.plist.
    info:
      path: Artemis/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAlarmKitUsageDescription: "Sets the alarms and timers you confirm in a chat."
        # Read by SharedInbox; the share extension hands items over through this group.
        ArtemisAppGroup: group.$(APP_BUNDLE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [artemis]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: Artemis/Artemis.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.$(APP_BUNDLE_ID)
    dependencies:
      - package: GRDB
      - package: Textual
      - target: ArtemisShare
      - target: ArtemisWidgets
    settings:
      base:
        PRODUCT_NAME: Artemis
        # Team and identifier come from Config/Base.xcconfig (and your Config/Local.xcconfig).
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "Artemis"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo or scan a document to attach to your message."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Lets the on-device model answer questions about your schedule and add events you confirm. Your calendar never leaves this device."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Lets the on-device model read your reminders and add ones you confirm. Your reminders never leave this device."
        INFOPLIST_KEY_NSContactsUsageDescription: "Lets the on-device model look up people you ask about and prepare calls or messages you confirm. Your contacts never leave this device."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Lets the on-device model answer questions about where you are, the weather and places nearby. Your location isn't shared with cloud models."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Lets the on-device model answer questions about your activity, sleep and workouts. Your health data never leaves this device."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lets you talk to Artemis in voice mode. Speech is recognized on this device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turns what you say in voice mode into text, on this device."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # Share sheet: stages what was shared in the App Group and opens the app on it.
  ArtemisShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: ArtemisShare
        excludes: ["*.js"]
      - path: ArtemisShare/SafariPage.js
        buildPhase: resources
      - path: Shared/SharedInbox.swift
      - path: Artemis/Core/Support/Locale+DisplayName.swift
    info:
      path: ArtemisShare/Info.plist
      properties:
        CFBundleDisplayName: Artemis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ArtemisAppGroup: group.$(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: SafariPage
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: ArtemisShare/ArtemisShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"

  # Control Center, Lock Screen and Action button controls.
  ArtemisWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: ArtemisWidgets
      - path: Shared/LaunchIntents.swift
    info:
      path: ArtemisWidgets/Info.plist
      properties:
        CFBundleDisplayName: Artemis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"

  ArtemisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: ArtemisTests
    dependencies:
      - target: Artemis
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
