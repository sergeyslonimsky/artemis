name: Artemis
options:
  bundleIdPrefix: com.artemis
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.3
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: 2.4.1

targets:
  Artemis:
    type: application
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: Artemis
    scheme:
      testTargets:
        - ArtemisTests
    # Keys without an INFOPLIST_KEY_ build setting; merged into the generated Info.plist.
    info:
      path: Artemis/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAlarmKitUsageDescription: "Sets the alarms and timers you confirm in a chat."
    entitlements:
      path: Artemis/Artemis.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: GRDB
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_NAME: Artemis
        PRODUCT_BUNDLE_IDENTIFIER: com.artemis.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PLFAQZ6LX2
        INFOPLIST_KEY_CFBundleDisplayName: "Artemis"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to attach to your message."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Lets the on-device model answer questions about your schedule and add events you confirm. Your calendar never leaves this device."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Lets the on-device model read your reminders and add ones you confirm. Your reminders never leave this device."
        INFOPLIST_KEY_NSContactsUsageDescription: "Lets the on-device model look up people you ask about and prepare calls or messages you confirm. Your contacts never leave this device."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Lets the on-device model answer questions about where you are, the weather and places nearby. Your location isn't shared with cloud models."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Lets the on-device model answer questions about your activity, sleep and workouts. Your health data never leaves this device."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lets you talk to Artemis in voice mode. Speech is recognized on this device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turns what you say in voice mode into text, on this device."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  ArtemisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: ArtemisTests
    dependencies:
      - target: Artemis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artemis.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PLFAQZ6LX2
